name: festival_buddy_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# ----------------------------------------------------------------------
# Versioning (Android: versionName / versionCode, iOS: CFBundleShortVersionString / CFBundleVersion)
# ----------------------------------------------------------------------
version: 1.0.0+1

environment:
  sdk: ^3.13.7   # adapt if your Flutter channel ships with a different Dart version

# ----------------------------------------------------------------------
# DEPENDENCIES – packages your app needs at runtime
# ----------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8          # iOS‑style icons
  http: ^1.2.0                     # simple HTTP client (fallback)
  dio: ^5.4.0                      # richer HTTP client + interceptors
  flutter_secure_storage: ^9.2.0  # encrypted token storage (Android/iOS)
  json_annotation: ^4.9.0
  provider: ^6.1.0                 # simple state‑management
  flutter_dotenv: ^5.0.2   # optional – lets you keep the URL out of source code
# ----------------------------------------------------------------------
# DEV DEPENDENCIES – packages used only while developing / building
# ----------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0           # recommended lint rules
  build_runner: ^2.4.11           # code‑gen driver
  json_serializable: ^6.8.0       # generates *.g.dart files

# ----------------------------------------------------------------------
# FLUTTER SECTION – assets, fonts, etc.
# ----------------------------------------------------------------------
flutter:
  uses-material-design: true
   # ----------  ASSETS ----------
  # Put the .env file (and any future static files) in the “assets” folder.
  # NOTE: The path **must be exactly** what you use later in `dotenv.load`.
  assets:
    - assets/.env 

  # Uncomment and add assets if you have any:
  # assets:
  #   - assets/images/logo.png

  # Uncomment and add fonts if you have any:
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf